name: Monitor SIMO

on:
  schedule:
    # Cada hora se programa un trabajo que revisa SIMO cada 5 minutos durante
    # ~5h40m. Si GitHub se retrasa, el trabajo que ya corre cubre el hueco.
    - cron: "17 * * * *"
  workflow_dispatch:          # botón "Run workflow" para probar a mano
    inputs:
      resumen:
        description: "Enviar ya al celular el resumen de puntajes y puesto"
        type: boolean
        default: true
      filtro:
        description: "Solo inscripciones que contengan este texto"
        type: string
        default: "2676"
      prueba:
        description: "Enviar una alerta urgente de prueba (push + correo)"
        type: boolean
        default: false
      ciclo:
        description: "Iniciar ya el ciclo de revisión cada 5 minutos (~5h40m)"
        type: boolean
        default: false
      debug:
        description: "Mostrar diagnóstico en el registro"
        type: boolean
        default: false

concurrency:
  # solo un ciclo a la vez; las ejecuciones manuales no hacen fila detrás
  group: ${{ (github.event_name == 'schedule' || inputs.ciclo) && 'simo-ciclo' || github.run_id }}
  cancel-in-progress: false

jobs:
  revisar:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests==2.32.3

      # Recupera el estado de la ejecución anterior (qué resultados ya se vieron)
      - uses: actions/cache/restore@v4
        with:
          path: estado_simo.json
          key: estado-simo-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: estado-simo-

      - name: Revisar SIMO
        env:
          SIMO_USER: ${{ secrets.SIMO_USER }}
          SIMO_PASS: ${{ secrets.SIMO_PASS }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          NTFY_EMAIL: ${{ secrets.NTFY_EMAIL }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          INCLUIR_PUNTAJE: "1"
          FILTRO: ${{ inputs.filtro || '2676' }}
          DEBUG: ${{ inputs.debug && '1' || '' }}
          MODO: ${{ inputs.prueba && 'prueba' || (inputs.resumen && 'resumen') || '' }}
          LOOP_MINUTES: ${{ (github.event_name == 'schedule' || inputs.ciclo) && '340' || '0' }}
          INTERVALO: "300"
          PYTHONUNBUFFERED: "1"   # registro en vivo mientras corre el ciclo
        run: python simo_monitor.py

      - uses: actions/cache/save@v4
        if: always() && hashFiles('estado_simo.json') != ''
        with:
          path: estado_simo.json
          key: estado-simo-${{ github.run_id }}-${{ github.run_attempt }}
