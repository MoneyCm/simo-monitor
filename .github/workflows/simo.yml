name: Monitor SIMO

on:
  schedule:
    - cron: "*/30 * * * *"   # cada 30 minutos (GitHub a veces se retrasa unos minutos)
  workflow_dispatch:          # botón "Run workflow" para probar a mano
    inputs:
      resumen:
        description: "Enviar ya al celular el resumen de puntajes y puesto"
        type: boolean
        default: true
      filtro:
        description: "Solo inscripciones que contengan este texto"
        type: string
        default: "2676"
      prueba:
        description: "Enviar una alerta urgente de prueba (push + correo)"
        type: boolean
        default: false
      debug:
        description: "Mostrar diagnóstico en el registro"
        type: boolean
        default: false

concurrency:
  group: simo-monitor
  cancel-in-progress: false

jobs:
  revisar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests==2.32.3

      # Recupera el estado de la ejecución anterior (qué resultados ya se vieron)
      - uses: actions/cache/restore@v4
        with:
          path: estado_simo.json
          key: estado-simo-${{ github.run_id }}
          restore-keys: estado-simo-

      - name: Revisar SIMO
        env:
          SIMO_USER: ${{ secrets.SIMO_USER }}
          SIMO_PASS: ${{ secrets.SIMO_PASS }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          NTFY_EMAIL: ${{ secrets.NTFY_EMAIL }}
          INCLUIR_PUNTAJE: "1"
          FILTRO: ${{ inputs.filtro || '2676' }}
          DEBUG: ${{ inputs.debug && '1' || '' }}
          MODO: ${{ inputs.prueba && 'prueba' || (inputs.resumen && 'resumen') || '' }}
        run: python simo_monitor.py

      - uses: actions/cache/save@v4
        if: always() && hashFiles('estado_simo.json') != ''
        with:
          path: estado_simo.json
          key: estado-simo-${{ github.run_id }}
